name: CI / CD

# Pull requests: lint + tests.  Push to staging: tests, then deploy to the "staging" environment.
# Push to main: tests, then deploy to "production".  Actions tab > Run workflow: redeploy or roll back by hand.
on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [deploy, rollback]
        default: deploy
      environment:
        description: Where
        type: choice
        options: [production, staging]
        default: production

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint + unit tests (PHP ${{ matrix.php }})
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, openssl, curl, fileinfo
          coverage: none
      - name: PHP syntax check
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - name: Unit tests
        run: php tests/unit.php

  test:
    name: Database + page tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: prepdeck
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, openssl, curl, fileinfo
          coverage: none
      - name: Test configuration
        run: |
          cat > .env <<'ENV'
          APP_ENV=testing
          APP_BASE=/
          APP_URL=http://127.0.0.1:8080
          APP_KEY=ci-only-key
          DB_HOST=127.0.0.1
          DB_NAME=prepdeck
          DB_USER=root
          DB_PASS=root
          MAIL_TRANSPORT=log
          MAIL_FROM=no-reply@prepdeck.test
          ENV
          mkdir -p storage/uploads/papers storage/uploads/notes storage/uploads/audio storage/uploads/outlines storage/logs
      - name: Build the database from the install files
        run: |
          mysql -h127.0.0.1 -uroot -proot prepdeck < database/prepdeck_fresh.sql
          mysql -h127.0.0.1 -uroot -proot prepdeck < database/sample_data.sql
      - name: Migrations apply, and are safe to run twice
        run: |
          php bin/migrate.php
          php bin/migrate.php | grep -q "up to date"
          php bin/selfcheck.php
      - name: Every page renders for admin, lecturer and student
        run: php tests/smoke.php --seed
      - name: HTTP checks
        run: |
          php -S 127.0.0.1:8080 -t public > server.log 2>&1 &
          sleep 2
          for p in "" login.php register.php sitemap.php robots.txt "page.php?p=privacy" api/health.php; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/$p")
            echo "$code /$p"; [ "$code" = "200" ] || exit 1
          done
          curl -fsS http://127.0.0.1:8080/api/health.php | grep -q '"status":"up"'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/dashboard/); [ "$code" = "302" ] || { echo "dashboard should redirect to login, got $code"; exit 1; }
      - name: Server log on failure
        if: failure()
        run: cat server.log storage/logs/*.log 2>/dev/null || true

  deploy:
    name: Deploy to ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
      cancel-in-progress: false            # never stop a deploy half way
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      PHP_BIN: ${{ vars.PHP_BIN || 'php' }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check settings
        run: |
          for v in SSH_HOST SSH_USER DEPLOY_PATH SITE_URL; do [ -n "${!v}" ] || { echo "::error::$v is not set for this environment (see README > Continuous deployment)"; exit 1; }; done
      - name: Build the release
        run: |
          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "$RELEASE" > RELEASE
          tar -czf "/tmp/release.tgz" \
            --exclude=.git --exclude=.github --exclude=tests --exclude=design-prototypes --exclude=.vscode \
            --exclude='./storage' --exclude='./.env' --exclude='./NIR' .
          ls -lh /tmp/release.tgz
      - name: SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null; fi
          printf 'Host target\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  ServerAliveInterval 30\n' "$SSH_HOST" "$SSH_PORT" "$SSH_USER" > ~/.ssh/config
      - name: Upload
        run: |
          ssh target "mkdir -p '$DEPLOY_PATH'"
          scp /tmp/release.tgz "target:$DEPLOY_PATH/incoming-$RELEASE.tgz"
      - name: Switch to the new release
        run: ssh target "DEPLOY_PATH='$DEPLOY_PATH' PHP_BIN='$PHP_BIN' bash -s -- deploy '$RELEASE'" < deploy/remote-deploy.sh
      - name: Health check (rolls back if the new release is not serving)
        run: |
          for i in $(seq 1 18); do
            body="$(curl -fsS --max-time 10 "$SITE_URL/api/health.php" || true)"
            if echo "$body" | grep -q "\"release\":\"$RELEASE\"" && echo "$body" | grep -q '"status":"up"'; then echo "Live and healthy: $RELEASE"; exit 0; fi
            echo "waiting for $RELEASE ($i/18)..."; sleep 10
          done
          echo "::error::The new release did not pass the health check. Rolling back."
          ssh target "DEPLOY_PATH='$DEPLOY_PATH' bash -s -- rollback" < deploy/remote-deploy.sh
          exit 1

  rollback:
    name: Roll back ${{ inputs.environment }}
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Roll back to the previous release
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "${{ secrets.SSH_HOST }}" > ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' bash -s -- rollback" < deploy/remote-deploy.sh
